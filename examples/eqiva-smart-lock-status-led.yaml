# ---------------------------------------------------------------
# Status-LED (WS2812/RGB) – Paket für eqiva-smart-lock-<nr>.yaml
# Version 3.5.9 (2026-11-12) – alle Dateien mit gleicher Version gehören zusammen (inkl. eqiva_components)
# Einbinden:   packages:
#                status_led: !include eqiva-smart-lock-status-led.yaml
# Nur für Boards mit (oder mit angeschlossener) WS2812-LED.
#
# Pin anpassen: in der Hauptdatei unter substitutions "status_led_pin: GPIOxx"
# setzen, sonst gilt der Standard unten (GPIO8 = eingebaute LED vieler C3-Boards).
# Mehrere LEDs: "status_led_count" setzen (DIN der 2. LED an DOUT der 1.).
# ---------------------------------------------------------------

substitutions:
  version_check: "true"     # Standard, wird von der Hauptdatei überschrieben
  status_led_pin: GPIO8
  status_led_count: "1"     # mehrere WS2812 in Reihe: alle zeigen dieselbe Farbe

light:
  - platform: esp32_rmt_led_strip
    id: status_led
    name: "Status LED"
    pin: ${status_led_pin}
    num_leds: ${status_led_count}
    channel_colors: GRB
    chipset: ws2812
    effects:
      - pulse:
          name: "pulse"
      - strobe:
          name: "strobe"
    web_server:
      sorting_group_id: sg_diag

# Interner Spiegel des Lock-Status: so muss die Hauptdatei nichts von der LED wissen.
text_sensor:
  - platform: copy
    source_id: lock_status
    id: lock_status_led
    internal: true
    on_value:
      then:
        - if:
            condition:
              lambda: 'return x == "LOCKED";'
            then:
              # grün = verriegelt (bei Zustandsfarben „Verriegelt rot“ getauscht)
              - light.turn_on:
                  id: status_led
                  effect: "none"
                  red: !lambda 'return id(key_ble)->state_colors_swapped() ? 1.0f : 0.0f;'
                  green: !lambda 'return id(key_ble)->state_colors_swapped() ? 0.0f : 1.0f;'
                  blue: 0%
                  brightness: 30%
        - if:
            condition:
              lambda: 'return x == "UNLOCKED";'
            then:
              # rot = aufgeschlossen (bei Zustandsfarben „Verriegelt rot“ getauscht)
              - light.turn_on:
                  id: status_led
                  effect: "none"
                  red: !lambda 'return id(key_ble)->state_colors_swapped() ? 0.0f : 1.0f;'
                  green: !lambda 'return id(key_ble)->state_colors_swapped() ? 1.0f : 0.0f;'
                  blue: 0%
                  brightness: 30%
        - if:
            condition:
              lambda: 'return x == "OPENED";'
            then:
              - light.turn_on: { id: status_led, effect: "none", red: 0%, green: 0%, blue: 100%, brightness: 30% }
        - if:
            condition:
              lambda: 'return x == "MOVING";'
            then:
              - light.turn_on: { id: status_led, effect: "pulse", red: 100%, green: 50%, blue: 0% }
        - if:
            condition:
              lambda: 'return x == "UNKNOWN";'
            then:
              - light.turn_on: { id: status_led, effect: "strobe", red: 60%, green: 0%, blue: 100% }   # lila blinken = unbekannt

# Versionsprüfung (wird nie ausgeführt, nur beim Kompilieren geprüft)
script:
  - id: ver_check_status_led
    then:
      - lambda: |-
          static_assert(!(${version_check}) || __builtin_strcmp("${config_version}", "3.5.9") == 0,
                        "Versionskonflikt: eqiva-smart-lock-status-led.yaml ist 3.5.9, Hauptdatei ist ${config_version} "
                        "(alle Dateien gleicher Version verwenden oder version_check: false)");
