# ---------------------------------------------------------------
# Statistik – ENTFÄLLT ab 3.6.0 (leere Hülle)
# Version 3.6.0 (2026-11-14) – alle Dateien mit gleicher Version gehören zusammen (inkl. eqiva_components)
#
# Die Zähler (Motorläufe, Verbindungsaufbauten) sind jetzt fest in der Komponente eingebaut und
# werden mit "Batterien gewechselt" zurückgesetzt (Verlauf der letzten 3 Wechsel in der Web-App).
# Diese Datei bleibt nur noch eine Version lang, damit eigene Hauptdateien mit
#     use_stats: "true"
#     - !include
#       file: eqiva-smart-lock-stats.yaml
#       condition: ${use_stats}
# ohne Änderung weiter kompilieren. Bitte diese Zeilen in der eigenen Hauptdatei löschen –
# in einer der nächsten Versionen fällt die Datei weg.
# ---------------------------------------------------------------

substitutions:
  version_check: "true"     # Standard, wird von der Hauptdatei überschrieben

script:
  - id: ver_check_stats
    then:
      - lambda: |-
          static_assert(!(${version_check}) || __builtin_strcmp("${config_version}", "3.6.0") == 0,
                        "Versionskonflikt: eqiva-smart-lock-stats.yaml ist 3.6.0, Hauptdatei ist ${config_version} "
                        "(alle Dateien gleicher Version verwenden oder version_check: false)");
