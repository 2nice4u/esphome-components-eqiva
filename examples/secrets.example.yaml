# Vorlage – als secrets.yaml in den ESPHome-Ordner kopieren (meist /config/esphome/) und ausfüllen.
# Die echte secrets.yaml NIE ins Repository hochladen.
#
# API-Schlüssel erzeugen: https://esphome.io/components/api.html (Generator) oder `openssl rand -base64 32`
# Jedes Schloss bekommt eigene Schlüssel und Passwörter.

# --- Eqiva Smart Lock 1 (eqiva-smart-lock-1.yaml) ---
eqiva_smart_lock_1_api_key: ""
eqiva_smart_lock_1_ota_password: ""
eqiva_smart_lock_1_web_password: ""
eqiva_smart_lock_1_ap_password: ""          # Fallback-WLAN, mind. 8 Zeichen

# --- Eqiva Smart Lock 2 (eqiva-smart-lock-2.yaml) ---
# Für ein zweites Schloss: Hauptdatei kopieren, lock_nr: "2" setzen und die
# vier !secret-Namen dort auf _2_ ändern. Kein zweites Schloss? Block einfach leer lassen.
eqiva_smart_lock_2_api_key: ""
eqiva_smart_lock_2_ota_password: ""
eqiva_smart_lock_2_web_password: ""
eqiva_smart_lock_2_ap_password: ""          # Fallback-WLAN, mind. 8 Zeichen

# --- WLAN (für alle Schlösser gemeinsam) ---
iot_wifi_ssid: ""
iot_wifi_password: ""
