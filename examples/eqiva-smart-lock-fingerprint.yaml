button:
  - platform: template
    name: "Fingerprint Sperre aufheben"
    icon: "mdi:lock-reset"
    web_server:
      sorting_group_id: sg_fp
    on_press:
      - lambda: |-
          id(fp_locked) = false;
          id(fp_failed_attempts) = 0;

  # Anlernen: Person + Hand + Finger -> vorhandenen Platz wiederverwenden, sonst nächsten freien
  - platform: template
    name: "Finger anlernen"
    id: fp_enroll_btn
    icon: "mdi:fingerprint"
    web_server:
      sorting_group_id: sg_fp_enroll
    on_press:
      - lambda: |-
          id(fp_enroll_target) = -1;
          id(fp_bell_pending) = false;   // vorgemerkte Klingel verwerfen
          std::string name = id(fp_person).state;
          name.erase(0, name.find_first_not_of(" "));
          name.erase(name.find_last_not_of(" ") + 1);
          for (auto &ch : name) if (ch == ',' || ch == '|') ch = ' ';   // Trennzeichen für Export
          if (name.size() > 15) name.resize(15);
          if (name.empty()) { id(fp_msg).execute("Bitte zuerst eine Person eintragen"); return; }
          const int h = id(fp_hand).active_index().value_or(0);
          const int f = id(fp_finger).active_index().value_or(0);
          const int a = id(fp_enroll_action).active_index().value_or(1);
          int p = -1, free_p = -1;
          for (int i = 0; i < 16; i++) {
            const char *n = id(fp_persons_v2)[i].data();
            if (n[0] == 0) { if (free_p < 0) free_p = i; continue; }
            if (std::string(n, strnlen(n, 15)) == name) { p = i; break; }
          }
          if (p < 0) p = free_p;
          if (p < 0) { id(fp_msg).execute("Kein Platz für weitere Personen (max. 16)"); return; }
          const uint16_t key = 0x8000 | ((p & 7) << 12) | ((p & 8) << 1) | (h << 11) | (f << 8);
          int slot = -1;
          for (int i = 0; i < 200; i++)
            if ((id(fp_map_v2)[i] & 0xFFF0) == key) { slot = i; break; }
          const bool again = slot >= 0;
          // freien Platz wählen: ohne Zuordnung UND im Sensor leer (alte Abdrücke nicht überschreiben)
          if (slot < 0)
            for (int i = 0; i < 200; i++) {
              const bool used = id(fp_idx_valid) && ((id(fp_idx)[i / 8] >> (i % 8)) & 1);
              if (!(id(fp_map_v2)[i] & 0x8000) && !used) { slot = i; break; }
            }
          if (slot < 0) { id(fp_msg).execute("Kein freier Speicherplatz im Fingerprint-Sensor"); return; }
          // Passt die neue Zuordnung noch in den Notizspeicher (512 Byte)? Sonst VOR dem Scannen ablehnen.
          {
            auto tm = id(fp_map_v2);
            auto tp = id(fp_persons_v2);
            if (tp[p][0] == 0) strncpy(tp[p].data(), name.c_str(), 15);
            tm[slot] = key | a;
            if (id(fp_export_str)(tm, tp).size() + 1 > 512) {
              id(fp_msg).execute("Kein Platz mehr für die Sicherung im Sensor – kürzere Namen verwenden oder Finger löschen");
              return;
            }
          }
          id(fp_enroll_target) = slot;
          id(fp_enroll_code) = key | a;
          id(fp_enroll_pidx) = p;
          id(fp_enroll_name) = name;
          id(fp_msg).execute(std::string(again ? "Neu anlernen: " : "Anlernen: ") + name + ", "
                             + id(fp_hand).current_option() + ", " + id(fp_finger).current_option()
                             + " – Finger " + to_string((int) id(fp_enroll_scans).state) + "× auflegen");
      - if:
          condition:
            lambda: 'return id(fp_enroll_target) >= 0;'
          then:
            - fingerprint_grow.enroll:
                finger_id: !lambda 'return id(fp_enroll_target);'
                num_scans: !lambda 'return (int) id(fp_enroll_scans).state;'
            - lambda: 'id(fp)->aura_led_control(1, 100, 3, 0);'   # lila atmen = Finger auflegen

  - platform: template
    name: "Anlernen abbrechen"
    id: fp_cancel_btn
    icon: "mdi:cancel"
    web_server:
      sorting_group_id: sg_fp_enroll
    on_press:
      - fingerprint_grow.cancel_enroll:
      - lambda: 'id(fp_enroll_target) = -1;'

  # Nur die Aktion des gewählten Fingers ändern (ohne neu anzulernen)
  - platform: template
    name: "Aktion übernehmen"
    icon: "mdi:check"
    web_server:
      sorting_group_id: sg_fp_enroll
    on_press:
      - lambda: |-
          std::string name = id(fp_person).state;
          name.erase(0, name.find_first_not_of(" "));
          name.erase(name.find_last_not_of(" ") + 1);
          for (auto &ch : name) if (ch == ',' || ch == '|') ch = ' ';   // Trennzeichen für Export
          const int h = id(fp_hand).active_index().value_or(0);
          const int f = id(fp_finger).active_index().value_or(0);
          const int a = id(fp_enroll_action).active_index().value_or(1);
          for (int p = 0; p < 16; p++) {
            const char *n = id(fp_persons_v2)[p].data();
            if (n[0] == 0 || std::string(n, strnlen(n, 15)) != name) continue;
            const uint16_t key = 0x8000 | ((p & 7) << 12) | ((p & 8) << 1) | (h << 11) | (f << 8);
            for (int i = 0; i < 200; i++) {
              if ((id(fp_map_v2)[i] & 0xFFF0) != key) continue;
              id(fp_map_v2)[i] = key | a;
              global_preferences->sync();
              id(fp_changed).execute();
              id(fp_msg).execute("Aktion geändert: " + name + ", " + id(fp_hand).current_option() + ", "
                                 + id(fp_finger).current_option() + " → " + id(fp_enroll_action).current_option());
              return;
            }
          }
          id(fp_msg).execute("Finger nicht gefunden – erst anlernen");

  # Bereits angelernten Finger nachträglich zuordnen: Finger auflegen (am besten mit
  # "Fingerprint aktiv" = aus, dann passiert am Schloss nichts), Person/Hand/Finger/Aktion
  # wählen und diesen Button drücken. Der zuletzt erkannte Platz bekommt die Zuordnung.
  - platform: template
    name: "Letzten Finger zuordnen"
    icon: "mdi:link-variant"
    web_server:
      sorting_group_id: sg_fp_enroll
    on_press:
      - lambda: |-
          const int slot = id(fp_last_slot);
          if (slot < 0) { id(fp_msg).execute("Erst einen Finger auflegen"); return; }
          if (slot >= 200) { id(fp_msg).execute("Platz " + to_string(slot) + " liegt außerhalb 0-39 – bitte neu anlernen"); return; }
          std::string name = id(fp_person).state;
          name.erase(0, name.find_first_not_of(" "));
          name.erase(name.find_last_not_of(" ") + 1);
          for (auto &ch : name) if (ch == ',' || ch == '|') ch = ' ';   // Trennzeichen für Export
          if (name.size() > 15) name.resize(15);
          if (name.empty()) { id(fp_msg).execute("Bitte zuerst eine Person eintragen"); return; }
          const int h = id(fp_hand).active_index().value_or(0);
          const int f = id(fp_finger).active_index().value_or(0);
          const int a = id(fp_enroll_action).active_index().value_or(1);
          int p = -1, free_p = -1;
          for (int i = 0; i < 16; i++) {
            const char *n = id(fp_persons_v2)[i].data();
            if (n[0] == 0) { if (free_p < 0) free_p = i; continue; }
            if (std::string(n, strnlen(n, 15)) == name) { p = i; break; }
          }
          if (p < 0) p = free_p;
          if (p < 0) { id(fp_msg).execute("Kein Platz für weitere Personen (max. 16)"); return; }
          const uint16_t key = 0x8000 | ((p & 7) << 12) | ((p & 8) << 1) | (h << 11) | (f << 8);
          for (int i = 0; i < 200; i++)
            if (i != slot && (id(fp_map_v2)[i] & 0xFFF0) == key) {
              id(fp_msg).execute("Dieser Finger ist schon Platz " + to_string(i) + " – dort erst löschen");
              return;
            }
          // Passt die Zuordnung noch in den Notizspeicher? Sonst ablehnen.
          {
            auto tm = id(fp_map_v2);
            auto tp = id(fp_persons_v2);
            if (tp[p][0] == 0) strncpy(tp[p].data(), name.c_str(), 15);
            tm[slot] = key | a;
            if (id(fp_export_str)(tm, tp).size() + 1 > 512) {
              id(fp_msg).execute("Kein Platz mehr für die Sicherung im Sensor – kürzere Namen verwenden oder Finger löschen");
              return;
            }
          }
          const int old_p = (id(fp_map_v2)[slot] & 0x8000) ? ((((id(fp_map_v2)[slot] >> 12) & 7) | ((id(fp_map_v2)[slot] >> 1) & 8))) : -1;
          if (id(fp_persons_v2)[p][0] == 0) {
            id(fp_persons_v2)[p].fill(0);
            strncpy(id(fp_persons_v2)[p].data(), name.c_str(), 15);
          }
          id(fp_map_v2)[slot] = key | a;
          // Person, die durch die Neuzuordnung keinen Finger mehr hat, entfernen
          if (old_p >= 0 && old_p != p) {
            bool used = false;
            for (auto c : id(fp_map_v2)) if ((c & 0x8000) && ((((c >> 12) & 7) | ((c >> 1) & 8))) == old_p) used = true;
            if (!used) id(fp_persons_v2)[old_p].fill(0);
          }
          global_preferences->sync();
          id(fp_changed).execute();
          id(fp_msg).execute("Zugeordnet: Platz " + to_string(slot) + " = " + name + ", " + id(fp_hand).current_option()
                             + ", " + id(fp_finger).current_option() + " (" + id(fp_enroll_action).current_option() + ")");

  # Beliebigen Speicherplatz per Nummer löschen (auch alte Finger ohne Zuordnung)
  - platform: template
    name: "Speicherplatz löschen"
    icon: "mdi:delete-outline"
    web_server:
      sorting_group_id: sg_fp_enroll
    on_press:
      - fingerprint_grow.delete:
          finger_id: !lambda 'return (int) id(fp_slot_nr).state;'
      - lambda: |-
          const int slot = (int) id(fp_slot_nr).state;
          if (slot < 200 && (id(fp_map_v2)[slot] & 0x8000)) {
            const int p = (((id(fp_map_v2)[slot] >> 12) & 7) | ((id(fp_map_v2)[slot] >> 1) & 8));
            id(fp_map_v2)[slot] = 0;
            bool used = false;
            for (auto c : id(fp_map_v2)) if ((c & 0x8000) && ((((c >> 12) & 7) | ((c >> 1) & 8))) == p) used = true;
            if (!used) id(fp_persons_v2)[p].fill(0);
            global_preferences->sync();
            id(fp_changed).execute();
          }
          id(fp_msg).execute("Speicherplatz " + to_string(slot) + " gelöscht");

  # Zuordnung aus dem Notizspeicher des Sensors laden (ersetzt die Zuordnung auf dem ESP)
  - platform: template
    name: "Zuordnung aus Sensor laden"
    icon: "mdi:database-arrow-down"
    web_server:
      sorting_group_id: sg_fp_enroll
    on_press:
      - script.execute: fp_np_wake
      - script.wait: fp_np_wake
      - lambda: |-
          std::string data;
          const int rc = id(fp_np_io)(id(uart_fp), 1, data, id(fp_idx));
          if (rc != 0) { id(fp_msg).execute("Sensor-Speicher nicht lesbar (Code " + to_string(rc) + ")"); return; }
          std::array<uint16_t, 200> nm{};
          std::array<std::array<char, 16>, 16> np{};
          std::string err;
          int count = 0;
          if (!id(fp_parse_str)(data, nm, np, err, count)) {
            id(fp_msg).execute(data.empty() ? std::string("Im Sensor ist keine Zuordnung gespeichert") : "Sensor-Speicher ungültig: " + err);
            return;
          }
          id(fp_np_last) = data;
          id(fp_map_v2) = nm;
          id(fp_persons_v2) = np;
          global_preferences->sync();
          std::string unused;
          if (id(fp_np_io)(id(uart_fp), 2, unused, id(fp_idx)) == 0) id(fp_idx_valid) = true;
          id(fp_overview).execute();
          id(fp_msg).execute("Zuordnung aus dem Sensor geladen: " + to_string(count) + " Finger");

  # Alle Finger löschen – Sicherung: innerhalb von 10 s zweimal drücken
  - platform: template
    name: "Alle Finger löschen (2× drücken)"
    icon: "mdi:delete-sweep"
    web_server:
      sorting_group_id: sg_fp_enroll
    on_press:
      - if:
          condition:
            lambda: 'return id(fp_delall_armed) != 0 && (millis() - id(fp_delall_armed)) < 10000UL;'
          then:
            - lambda: 'id(fp_delall_armed) = 0;'
            - fingerprint_grow.delete_all:
            - lambda: |-
                id(fp_map_v2).fill(0);
                for (auto &p : id(fp_persons_v2)) p.fill(0);
                global_preferences->sync();
                id(fp_changed).execute();
                id(fp_msg).execute("Alle Finger gelöscht");
          else:
            - lambda: |-
                id(fp_delall_armed) = millis() | 1;   // nie 0
                id(fp_msg).execute("Wirklich ALLE Finger löschen? Zum Bestätigen innerhalb von 10 s erneut drücken");

  # Person umbenennen: "Person" = alter Name, "Neuer Name" = neuer Name. Finger, Plätze und Aktionen bleiben.
  # Existiert der neue Name schon: Rückfrage, 2× drücken (10 s) führt beide Personen zusammen.
  - platform: template
    name: "Person umbenennen"
    icon: "mdi:account-edit"
    web_server:
      sorting_group_id: sg_fp_enroll
    on_press:
      - lambda: |-
          auto trim = [](std::string n) {
            n.erase(0, n.find_first_not_of(" "));
            n.erase(n.find_last_not_of(" ") + 1);
            for (auto &ch : n) if (ch == ',' || ch == '|') ch = ' ';
            if (n.size() > 15) n.resize(15);
            return n;
          };
          const std::string oldn = trim(id(fp_person).state), newn = trim(id(fp_new_name).state);
          if (oldn.empty()) { id(fp_msg).execute("Bitte bei „Person“ den bisherigen Namen eintragen"); return; }
          if (newn.empty()) { id(fp_msg).execute("Bitte bei „Neuer Name“ einen Namen eintragen"); return; }
          if (newn == oldn) { id(fp_msg).execute("Neuer Name ist gleich dem alten"); return; }
          auto &per = id(fp_persons_v2);
          auto &map = id(fp_map_v2);
          int po = -1, pn = -1;
          for (int i = 0; i < 16; i++) {
            const std::string n(per[i].data(), strnlen(per[i].data(), 15));
            if (per[i][0] == 0) continue;
            if (n == oldn) po = i;
            if (n == newn) pn = i;
          }
          if (po < 0) { id(fp_msg).execute("Person „" + oldn + "“ nicht gefunden"); return; }
          auto pers_of = [](uint16_t c) { return (int) (((c >> 12) & 7) | ((c >> 1) & 8)); };
          int fingers = 0;
          for (auto c : map) if ((c & 0x8000) && pers_of(c) == po) fingers++;
          if (pn < 0) {
            // Umbenennen: passt der (evtl. längere) Name noch in die Sicherung im Sensor?
            auto tp = per;
            tp[po].fill(0);
            strncpy(tp[po].data(), newn.c_str(), 15);
            if (id(fp_export_str)(map, tp).size() + 1 > 512) {
              id(fp_msg).execute("Kein Platz mehr für die Sicherung im Sensor – kürzeren Namen verwenden");
              return;
            }
            per = tp;
            id(fp_rename_armed) = 0;
            global_preferences->sync();
            id(fp_changed).execute();
            id(fp_person).make_call().set_value(newn).perform();
            id(fp_msg).execute("Umbenannt: " + oldn + " → " + newn + " (" + to_string(fingers) + " Finger)");
            return;
          }
          // Neuer Name existiert schon -> Zusammenführen nur nach Bestätigung (2× drücken in 10 s)
          const std::string pair = oldn + "|" + newn;
          if (id(fp_rename_armed) == 0 || (millis() - id(fp_rename_armed)) >= 10000UL || id(fp_rename_pair) != pair) {
            id(fp_rename_armed) = millis() | 1;
            id(fp_rename_pair) = pair;
            id(fp_msg).execute("„" + newn + "“ existiert bereits – zum Zusammenführen innerhalb von 10 s erneut drücken");
            return;
          }
          id(fp_rename_armed) = 0;
          // Gleicher Finger (Hand + Finger) bei beiden Personen? Dann ablehnen.
          static const char *const fs[] = {"Daumen", "Zeige", "Mittel", "Ring", "Klein"};
          std::string clash;
          for (int i = 0; i < 200; i++) {
            const uint16_t a = map[i];
            if (!(a & 0x8000) || pers_of(a) != po) continue;
            for (int j = 0; j < 200; j++) {
              const uint16_t b = map[j];
              if (!(b & 0x8000) || pers_of(b) != pn) continue;
              if (((a >> 8) & 0x0F) == ((b >> 8) & 0x0F)) {   // Hand (Bit 11) + Finger (Bit 8-10)
                if (!clash.empty()) clash += ", ";
                clash += std::string(((a >> 11) & 1) ? "R-" : "L-") + fs[((a >> 8) & 7) % 5] +
                         " (#" + to_string(i) + " und #" + to_string(j) + ")";
              }
            }
          }
          if (!clash.empty()) {
            id(fp_msg).execute("Zusammenführen nicht möglich – beide haben " + clash + ". Erst einen davon löschen.");
            return;
          }
          for (auto &c : map)
            if ((c & 0x8000) && pers_of(c) == po)
              c = (c & ~0x7010) | ((pn & 7) << 12) | ((pn & 8) << 1);   // Person-Bits ersetzen
          per[po].fill(0);
          global_preferences->sync();
          id(fp_changed).execute();
          id(fp_person).make_call().set_value(newn).perform();
          id(fp_msg).execute("Zusammengeführt: " + oldn + " → " + newn + " (" + to_string(fingers) + " Finger)");

  - platform: template
    name: "Finger löschen"
    icon: "mdi:delete"
    web_server:
      sorting_group_id: sg_fp_enroll
    on_press:
      - lambda: |-
          id(fp_del_target) = -1;
          std::string name = id(fp_person).state;
          name.erase(0, name.find_first_not_of(" "));
          name.erase(name.find_last_not_of(" ") + 1);
          for (auto &ch : name) if (ch == ',' || ch == '|') ch = ' ';   // Trennzeichen für Export
          const int h = id(fp_hand).active_index().value_or(0);
          const int f = id(fp_finger).active_index().value_or(0);
          for (int p = 0; p < 16 && id(fp_del_target) < 0; p++) {
            const char *n = id(fp_persons_v2)[p].data();
            if (n[0] == 0 || std::string(n, strnlen(n, 15)) != name) continue;
            const uint16_t key = 0x8000 | ((p & 7) << 12) | ((p & 8) << 1) | (h << 11) | (f << 8);
            for (int i = 0; i < 200; i++)
              if ((id(fp_map_v2)[i] & 0xFFF0) == key) { id(fp_del_target) = i; break; }
          }
          if (id(fp_del_target) < 0) id(fp_msg).execute("Finger nicht gefunden");
      - if:
          condition:
            lambda: 'return id(fp_del_target) >= 0;'
          then:
            - fingerprint_grow.delete:
                finger_id: !lambda 'return id(fp_del_target);'
            - lambda: |-
                const int slot = id(fp_del_target);
                const int p = (((id(fp_map_v2)[slot] >> 12) & 7) | ((id(fp_map_v2)[slot] >> 1) & 8));
                id(fp_map_v2)[slot] = 0;
                // Person ohne Finger aus der Liste entfernen
                bool used = false;
                for (auto c : id(fp_map_v2)) if ((c & 0x8000) && ((((c >> 12) & 7) | ((c >> 1) & 8))) == p) used = true;
                if (!used) id(fp_persons_v2)[p].fill(0);
                global_preferences->sync();
                id(fp_changed).execute();
                id(fp_msg).execute("Gelöscht: " + id(fp_person).state + ", " + id(fp_hand).current_option()
                                   + ", " + id(fp_finger).current_option());
                id(fp_del_target) = -1;

