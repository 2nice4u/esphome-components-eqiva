# ---------------------------------------------------------------
# Zeitplan – Paket für eqiva-smart-lock-<nr>.yaml
# Version 3.5.6 (2026-11-10) – alle Dateien mit gleicher Version gehören zusammen (inkl. eqiva_components)
# Einbinden:   packages:
#                schedule: !include eqiva-smart-lock-schedule.yaml
#
# Bis zu 6 Zeitpläne, je ein Textfeld "Zeitplan 1" … "Zeitplan 6". Bequem in der Web-App bearbeiten,
# in der Expertenansicht / in Home Assistant auch von Hand:
#
#     an 22:00 Mo-So zu        täglich 22:00 zuschließen
#     an 07:45 Mo-Fr zu        werktags 07:45 zuschließen
#     aus 09:00 Sa,So auf      ausgeschaltet (bleibt gespeichert)
#     an 22:00 Mo-So zu ±10    zufällig zwischen 21:50 und 22:10
#     an 06:30 Mo-Fr auf +15   zufällig zwischen 06:30 und 06:45 (nie früher)
#     (leer)                   nicht belegt
#
# an/aus (Standard an) · Uhrzeit HH:MM · Wochentage wie "Mo-Fr", "Sa,So", "Mo-Do,So", "täglich"
# (ohne Angabe = täglich) · zu/auf · optional Zufall: +N (nur später), -N (nur früher), ±N oder +-N
# (beides), N = 1…60 Minuten. Reihenfolge egal, Groß-/Kleinschreibung egal.
# Die zufällige Zeit wird je Zeitplan einmal am Tag neu ausgewürfelt (am Tagesanfang gekappt, 00:00–23:59).
# Läuft ohne Home Assistant: Uhrzeit per SNTP, ersatzweise von HA.
# Kommt keine Bestätigung vom Schloss, wird bis zu 3× im Minutenabstand wiederholt.
# Zeitpläne 1 und 2 aus Versionen vor 3.4.0 werden beim ersten Start automatisch übernommen.
# ---------------------------------------------------------------

substitutions:
  version_check: "true"     # Standard, wird von der Hauptdatei überschrieben
  timezone: "Europe/Berlin"
  sntp_server: "0.pool.ntp.org"   # bei gesperrtem Internet z. B. IP der OPNsense

web_server:
  sorting_groups:
    - id: sg_sched
      name: "Zeitplan"
      sorting_weight: -5

time:
  - platform: sntp
    id: sntp_time
    timezone: ${timezone}
    servers:
      - ${sntp_server}

globals:
  - id: sched_cmd          # 0 nichts, 1 aufschließen, 2 zuschließen
    type: int
    initial_value: '0'
  - id: sched_expect       # wartet auf Bestätigung (1 auf, 2 zu)
    type: int
    initial_value: '0'
  - id: sched_retries
    type: int
    initial_value: '0'
  - id: sched_which        # welcher Zeitplan (1-6) zuletzt ausgelöst hat
    type: int
    initial_value: '0'
  - id: sched_last         # Text "Zuletzt: …"
    type: std::string
    initial_value: '""'
  - id: sched_migrated     # Zeitpläne 1/2 aus dem alten Format übernommen
    type: bool
    restore_value: true
    initial_value: 'false'
script:
  - id: ver_check_schedule
    then:
      - lambda: |-
          static_assert(!(${version_check}) || __builtin_strcmp("${config_version}", "3.5.6") == 0,
                        "Versionskonflikt: eqiva-smart-lock-schedule.yaml ist 3.5.6, Hauptdatei ist ${config_version} "
                        "(alle Dateien gleicher Version verwenden oder version_check: false)");
  # Befehl ans Schloss (lokal, ohne HA)
  - id: sched_send
    mode: queued
    then:
      - lambda: 'id(key_ble)->set_cmd_source("Zeitplan " + to_string(id(sched_which)));'   # Ereignisprotokoll
      - if:
          condition:
            lambda: 'return id(sched_cmd) == 1;'
          then:
            - eqiva_key_ble.unlock:
      - if:
          condition:
            lambda: 'return id(sched_cmd) == 2;'
          then:
            - eqiva_key_ble.lock:
      - lambda: 'id(sched_cmd) = 0;'

# Jede Minute prüfen (10-s-Raster, jede Minute wird genau einmal ausgewertet)
interval:
  - interval: 10s
    then:
      - lambda: |-
          // Einmalig: Zeitpläne 1/2 aus dem alten Format (bis 3.3.x) übernehmen
          if (!id(sched_migrated)) {
            id(sched_migrated) = true;
            if (id(sched_txt1).state.empty() && id(sched_txt2).state.empty()) {
              struct Old { bool on; int h, m; std::string days; int act; };
              Old o[2] = {
                {id(sched1_on).state, id(sched1_time).hour, id(sched1_time).minute, id(sched1_days).state,
                 (int) id(sched1_action).active_index().value_or(0)},
                {id(sched2_on).state, id(sched2_time).hour, id(sched2_time).minute, id(sched2_days).state,
                 (int) id(sched2_action).active_index().value_or(0)},
              };
              for (int i = 0; i < 2; i++) {
                char buf[64];
                snprintf(buf, sizeof(buf), "%s %02d:%02d %s %s", o[i].on ? "an" : "aus", o[i].h, o[i].m,
                         o[i].days.empty() ? "Mo-So" : o[i].days.c_str(), o[i].act == 1 ? "auf" : "zu");
                auto *txt = i == 0 ? id(sched_txt1) : id(sched_txt2);
                txt->make_call().set_value(buf).perform();
                ESP_LOGI("sched", "Zeitplan %d übernommen: %s", i + 1, buf);
              }
            }
            global_preferences->sync();
          }

          // Eine Zeile auswerten
          static const auto sched_parse = [](const std::string &line) -> std::array<int, 9> {
            // Rückgabe: {gültig, leer, an, Stunde, Minute, Tage-Maske Bit0=Mo…Bit6=So, Aktion 1 auf/2 zu,
            //            Zufall 0 aus/1 früher/2 später/3 beides, Zufall-Minuten}
            std::array<int, 9> r{0, 0, 1, 0, 0, 0x7F, 2, 0, 0};
            std::string s = line;
            for (auto &c : s) c = tolower((unsigned char) c);
            auto days_mask = [](std::string d) -> int {
              d.erase(std::remove(d.begin(), d.end(), ' '), d.end());
          for (size_t k; (k = d.find(",-")) != std::string::npos || (k = d.find("-,")) != std::string::npos;)
            d.erase(k + (d[k] == ',' ? 0 : 1), 1);   // "Mo - Fr" -> "Mo-Fr"
              if (d.empty() || d == "täglich" || d == "taeglich" || d == "alle" || d == "mo-so") return 0x7F;
              static const char *const n[] = {"mo", "di", "mi", "do", "fr", "sa", "so"};
              auto idx = [&](const std::string &x) { for (int i = 0; i < 7; i++) if (x == n[i]) return i; return -1; };
              int mask = 0;
              size_t pos = 0;
              while (pos <= d.size()) {
                size_t e = d.find(',', pos);
                std::string tok = d.substr(pos, e == std::string::npos ? std::string::npos : e - pos);
                pos = (e == std::string::npos) ? d.size() + 1 : e + 1;
                if (tok.empty()) continue;
                size_t dash = tok.find('-');
                int a = idx(tok.substr(0, dash));
                int b = dash == std::string::npos ? a : idx(tok.substr(dash + 1));
                if (a < 0 || b < 0) return -1;
                for (int i = a;; i = (i + 1) % 7) { mask |= 1 << i; if (i == b) break; }   // auch "Fr-Mo"
              }
              return mask;
            };
            std::string days;
            bool have_time = false, any = false;
            size_t pos = 0;
            while (pos < s.size()) {
              while (pos < s.size() && s[pos] == ' ') pos++;
              size_t e = s.find(' ', pos);
              std::string tok = s.substr(pos, e == std::string::npos ? std::string::npos : e - pos);
              pos = (e == std::string::npos) ? s.size() : e;
              if (tok.empty()) continue;
              any = true;
              int hh, mm; char extra;
              // Zufall: "+10", "-10", "±10" (UTF-8 C2 B1) oder "+-10"
              int rdir = 0; size_t rp = 0;
              if (tok.compare(0, 2, "\xc2\xb1") == 0 || tok.compare(0, 2, "+-") == 0) { rdir = 3; rp = 2; }
              else if (tok[0] == '+') { rdir = 2; rp = 1; }
              else if (tok[0] == '-') { rdir = 1; rp = 1; }
              const std::string rnum = rdir ? tok.substr(rp) : std::string();
              const bool rnum_ok = !rnum.empty() && rnum.size() <= 2 &&
                                   std::all_of(rnum.begin(), rnum.end(), [](char c) { return c >= '0' && c <= '9'; });
              if (rdir && rnum_ok && atoi(rnum.c_str()) <= 60) {
                r[8] = atoi(rnum.c_str());
                r[7] = r[8] ? rdir : 0;
              } else if (tok == "an" || tok == "ein" || tok == "on") r[2] = 1;
              else if (tok == "aus" || tok == "off") r[2] = 0;
              else if (tok == "zu" || tok == "zuschließen" || tok == "zuschliessen" || tok == "lock") r[6] = 2;
              else if (tok == "auf" || tok == "aufschließen" || tok == "aufschliessen" || tok == "unlock") r[6] = 1;
              else if ((sscanf(tok.c_str(), "%d:%d%c", &hh, &mm, &extra) == 2 ||
                    sscanf(tok.c_str(), "%d:%d:00%c", &hh, &mm, &extra) == 2) && hh >= 0 && hh < 24 && mm >= 0 && mm < 60) {
                r[3] = hh; r[4] = mm; have_time = true;
              } else {
                days += (days.empty() ? "" : ",") + tok;
              }
            }
            if (!any) { r[1] = 1; return r; }   // leer = nicht belegt
            r[5] = days_mask(days);
            r[0] = have_time && r[5] > 0;
            return r;
          };

          ESPTime t = id(sntp_time).now();
          if (!t.is_valid()) t = id(ha_time).now();
          static const char *const wdn[] = {"Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"};
          const std::string *lines[6] = {&id(sched_txt1).state, &id(sched_txt2).state, &id(sched_txt3).state,
                                         &id(sched_txt4).state, &id(sched_txt5).state, &id(sched_txt6).state};
          std::array<std::array<int, 9>, 6> sc;
          for (int i = 0; i < 6; i++) sc[i] = sched_parse(*lines[i]);
          // aktiv = gültig, belegt und eingeschaltet
          auto active = [&](int i) { return sc[i][0] && !sc[i][1] && sc[i][2]; };
          // Zufall: je Zeitplan einmal am Tag auswürfeln (neu bei geändertem Text). done_* verhindert, dass ein
          // unveränderter Zeitplan am selben Tag zweimal auslöst; nach einer Änderung darf er wieder.
          static int roll_day[6] = {-1, -1, -1, -1, -1, -1}, roll_off[6] = {0}, done_day[6] = {-1, -1, -1, -1, -1, -1};
          static std::string roll_line[6], done_line[6];
          auto done_today = [&](int i, int doy) { return done_day[i] == doy && done_line[i] == *lines[i]; };
          static const char *const rsym[] = {"", "-", "+", "±"};
          auto base_min = [&](int i) { return sc[i][3] * 60 + sc[i][4]; };
          auto eff_min = [&](int i) { int m = base_min(i) + roll_off[i]; return m < 0 ? 0 : (m > 1439 ? 1439 : m); };

          std::string status;
          if (!t.is_valid()) {
            status = "Keine Uhrzeit (SNTP/HA) – Zeitplan pausiert";
          } else {
            static int last_key = -1;
            const int key = t.day_of_year * 1440 + t.hour * 60 + t.minute;
            const int wd = (t.day_of_week + 5) % 7;   // ESPTime: 1 = So … 7 = Sa -> 0 = Mo
            for (int i = 0; i < 6; i++) {
              if (roll_day[i] == t.day_of_year && roll_line[i] == *lines[i]) continue;
              roll_day[i] = t.day_of_year;
              roll_line[i] = *lines[i];
              roll_off[i] = 0;
              if (!sc[i][0] || !sc[i][7]) continue;
              const int m = sc[i][8], dir = sc[i][7];
              const int r = (int) (random_uint32() % (uint32_t) (dir == 3 ? 2 * m + 1 : m + 1));
              roll_off[i] = dir == 1 ? -r : (dir == 2 ? r : r - m);
              ESP_LOGI("sched", "Zeitplan %d: heute %02d:%02d (%02d:%02d %s%d)", i + 1, eff_min(i) / 60, eff_min(i) % 60,
                       sc[i][3], sc[i][4], rsym[dir], m);
            }
            if (key != last_key) {
              last_key = key;
              // 1) Bestätigung prüfen / wiederholen
              if (id(sched_expect) != 0) {
                const std::string &st = id(lock_status).state;
                const bool ok = id(sched_expect) == 2 ? st == "LOCKED" : (st == "UNLOCKED" || st == "OPENED");
                const char *what = id(sched_expect) == 2 ? "zugeschlossen" : "aufgeschlossen";
                char buf[64];
                if (ok) {
                  snprintf(buf, sizeof(buf), "%s %02d:%02d %s ✓", wdn[wd], t.hour, t.minute, what);
                  id(sched_last) = buf;
                  id(sched_expect) = 0;
                } else if (id(sched_retries) > 0) {
                  id(sched_retries)--;
                  ESP_LOGW("sched", "Keine Bestätigung – neuer Versuch (%d übrig)", id(sched_retries));
                  id(sched_cmd) = id(sched_expect);
                  id(sched_send).execute();
                } else {
                  snprintf(buf, sizeof(buf), "%s %02d:%02d nicht %s ✗", wdn[wd], t.hour, t.minute, what);
                  id(sched_last) = buf;
                  id(sched_expect) = 0;
                  ESP_LOGE("sched", "Zeitplan %d: Schloss hat nicht bestätigt", id(sched_which));
                }
              }
              // 2) Fällige Zeitpläne auslösen (bei mehreren gleichzeitig gilt der erste)
              for (int i = 0; i < 6; i++) {
                if (!active(i) || !(sc[i][5] & (1 << wd)) || eff_min(i) != t.hour * 60 + t.minute ||
                    done_today(i, t.day_of_year)) continue;
                done_day[i] = t.day_of_year;
                done_line[i] = *lines[i];
                const int cmd = sc[i][6];
                ESP_LOGI("sched", "Zeitplan %d: %s", i + 1, cmd == 2 ? "zuschließen" : "aufschließen");
                id(sched_which) = i + 1;
                id(sched_cmd) = cmd;
                id(sched_expect) = cmd;
                id(sched_retries) = 3;
                id(sched_send).execute();
                break;
              }
            }
            // 3) Nächsten Termin berechnen
            // heute: ausgewürfelte Zeit, andere Tage: eingestellte Zeit (Zufall steht dann dahinter)
            int best = -1, best_i = -1, best_day = 0, best_min = 0;
            bool best_today = false;
            const int now_min = t.hour * 60 + t.minute;
            for (int i = 0; i < 6; i++) {
              if (!active(i)) continue;
              for (int d = 0; d <= 7; d++) {
                const int day = (wd + d) % 7;
                const int at = d == 0 ? eff_min(i) : base_min(i);
                const int off = d * 1440 + at - now_min;
                if (!(sc[i][5] & (1 << day)) || off <= 0 || (d == 0 && done_today(i, t.day_of_year))) continue;
                if (best < 0 || off < best) { best = off; best_i = i; best_day = day; best_min = at; best_today = d == 0; }
                break;
              }
            }
            for (int i = 0; i < 6; i++)
              if (!sc[i][1] && !sc[i][0]) status += "Zeitplan " + to_string(i + 1) + " ungültig! ";
            if (best >= 0) {
              char buf[96];
              const char *what = sc[best_i][6] == 1 ? "aufschließen" : "zuschließen";
              const int rd = sc[best_i][7], rm = sc[best_i][8];
              if (!rd)
                snprintf(buf, sizeof(buf), "Nächstes: %s %02d:%02d %s", wdn[best_day], best_min / 60, best_min % 60, what);
              else if (best_today)   // z. B. "Nächstes: Fr 22:07 zuschließen (22:00 ±10)"
                snprintf(buf, sizeof(buf), "Nächstes: %s %02d:%02d %s (%02d:%02d %s%d)", wdn[best_day], best_min / 60,
                         best_min % 60, what, sc[best_i][3], sc[best_i][4], rsym[rd], rm);
              else                   // z. B. "Nächstes: Sa 22:00 ±10 zuschließen"
                snprintf(buf, sizeof(buf), "Nächstes: %s %02d:%02d %s%d %s", wdn[best_day], best_min / 60,
                         best_min % 60, rsym[rd], rm, what);
              status += buf;
            } else if (status.empty()) {
              status = "Kein Zeitplan aktiv";
            }
          }
          // Uhrzeit des ESP für die Kopfzeile der Web-App (leer = keine Uhrzeit bekannt, Zeitplan pausiert)
          {
            char hm[8] = "";
            if (t.is_valid()) snprintf(hm, sizeof(hm), "%02d:%02d", t.hour, t.minute);
            if (id(esp_time_txt).state != hm) id(esp_time_txt).publish_state(hm);
          }
          if (!id(sched_last).empty()) status += " · Zuletzt: " + id(sched_last);
          if (status != id(sched_status).state) id(sched_status).publish_state(status);   // nur bei Änderung

text_sensor:
  - platform: template
    name: "ESP Uhrzeit"
    id: esp_time_txt
    icon: "mdi:clock-outline"
    update_interval: never
    entity_category: diagnostic
    web_server:
      sorting_group_id: sg_sched
  - platform: template
    name: "Zeitplan"
    id: sched_status
    icon: "mdi:calendar-clock"
    update_interval: never
    web_server:
      sorting_group_id: sg_sched

text:
  # --- Die 6 Zeitpläne (Format siehe oben) ---
  - platform: template
    name: "Zeitplan 1"
    id: sched_txt1
    icon: "mdi:calendar-clock"
    mode: text
    max_length: 50
    optimistic: true
    restore_value: true
    initial_value: ""
    entity_category: config
    web_server:
      sorting_group_id: sg_sched
  - platform: template
    name: "Zeitplan 2"
    id: sched_txt2
    icon: "mdi:calendar-clock"
    mode: text
    max_length: 50
    optimistic: true
    restore_value: true
    initial_value: ""
    entity_category: config
    web_server:
      sorting_group_id: sg_sched
  - platform: template
    name: "Zeitplan 3"
    id: sched_txt3
    icon: "mdi:calendar-clock"
    mode: text
    max_length: 50
    optimistic: true
    restore_value: true
    initial_value: ""
    entity_category: config
    web_server:
      sorting_group_id: sg_sched
  - platform: template
    name: "Zeitplan 4"
    id: sched_txt4
    icon: "mdi:calendar-clock"
    mode: text
    max_length: 50
    optimistic: true
    restore_value: true
    initial_value: ""
    entity_category: config
    web_server:
      sorting_group_id: sg_sched
  - platform: template
    name: "Zeitplan 5"
    id: sched_txt5
    icon: "mdi:calendar-clock"
    mode: text
    max_length: 50
    optimistic: true
    restore_value: true
    initial_value: ""
    entity_category: config
    web_server:
      sorting_group_id: sg_sched
  - platform: template
    name: "Zeitplan 6"
    id: sched_txt6
    icon: "mdi:calendar-clock"
    mode: text
    max_length: 50
    optimistic: true
    restore_value: true
    initial_value: ""
    entity_category: config
    web_server:
      sorting_group_id: sg_sched

  # --- Altes Format (bis 3.3.x), nur noch intern zum einmaligen Übernehmen ---
  # Gleiche Namen wie früher, damit die gespeicherten Werte gefunden werden.
  - platform: template
    name: "Zeitplan 1 Wochentage"
    id: sched1_days
    internal: true
    mode: text
    max_length: 30
    optimistic: true
    restore_value: true
    initial_value: "Mo-So"
  - platform: template
    name: "Zeitplan 2 Wochentage"
    id: sched2_days
    internal: true
    mode: text
    max_length: 30
    optimistic: true
    restore_value: true
    initial_value: "Mo-Fr"

switch:
  - platform: template
    name: "Zeitplan 1 aktiv"
    id: sched1_on
    internal: true
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    name: "Zeitplan 2 aktiv"
    id: sched2_on
    internal: true
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

datetime:
  - platform: template
    name: "Zeitplan 1 Uhrzeit"
    id: sched1_time
    internal: true
    type: time
    optimistic: true
    restore_value: true
    initial_value: "22:00:00"
  - platform: template
    name: "Zeitplan 2 Uhrzeit"
    id: sched2_time
    internal: true
    type: time
    optimistic: true
    restore_value: true
    initial_value: "07:45:00"

select:
  - platform: template
    name: "Zeitplan 1 Aktion"
    id: sched1_action
    internal: true
    options: ["Zuschließen", "Aufschließen"]
    initial_option: "Zuschließen"
    optimistic: true
    restore_value: true
  - platform: template
    name: "Zeitplan 2 Aktion"
    id: sched2_action
    internal: true
    options: ["Zuschließen", "Aufschließen"]
    initial_option: "Zuschließen"
    optimistic: true
    restore_value: true
